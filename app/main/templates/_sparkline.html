{# trend line helper, included inside a <script> block; needs static/js/chart.umd.min.js #}
  // tooltip as an html element below the line: a tooltip drawn inside the small canvas gets cut off
  function sparkline_tooltip(context) {
    var el = document.getElementById('sparkline-tooltip');
    if (!el) {
      el = document.createElement('div');
      el.id = 'sparkline-tooltip';
      el.className = 'bg-dark text-white small rounded px-2 py-1';
      el.style.cssText = 'position: absolute; pointer-events: none; z-index: 1080; white-space: nowrap; display: none;';
      document.body.appendChild(el);
    }
    var tooltip = context.tooltip;
    if (tooltip.opacity === 0 || !tooltip.dataPoints || !tooltip.dataPoints.length) {
      el.style.display = 'none';
      return;
    }
    var point = tooltip.dataPoints[0];
    el.textContent = point.label + ': ' + point.formattedValue + ' ' + point.dataset.label.toLowerCase();
    el.style.display = 'block';
    var rect = context.chart.canvas.getBoundingClientRect();
    el.style.left = (window.scrollX + rect.left + tooltip.caretX - el.offsetWidth / 2) + 'px';
    // below the chart, so the line and the text above it stay visible
    el.style.top = (window.scrollY + rect.bottom + 6) + 'px';
  }

  // small trend line without axes, from [{date, value}]; draws nothing when chart.js is not loaded
  function sparkline(canvas, points, label, color) {
    if (!window.Chart || !canvas || !points.length) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: points.map(function (p) { return p.date; }),
        datasets: [{
          label: label,
          data: points.map(function (p) { return p.value; }),
          borderColor: color,
          backgroundColor: color,
          borderWidth: 2,
          pointRadius: points.length == 1 ? 3 : 0,
          pointHitRadius: 6,
          tension: 0.2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: {mode: 'index', intersect: false},
        layout: {padding: 3},   // room for the line's width at the top and bottom
        plugins: {legend: {display: false}, tooltip: {enabled: false, external: sparkline_tooltip}},
        scales: {x: {display: false}, y: {display: false, beginAtZero: true}},
      },
    });
  }
